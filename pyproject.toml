[project]
name = "rdc"
dynamic = ["version"]
description = "远程桌面控制软件 V1 首版"
requires-python = ">=3.12"

[tool.setuptools.dynamic]
version = {attr = "rdc.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts", "poc/tools", "deploy"]
extend-exclude = ["android", "poc/legacy", ".team", "docs", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "T20", "S"]
ignore = [
  "S101",  # 测试与冒烟允许 assert
  "S603",  # 冒烟需要起子进程
  "S607",  # 冒烟使用 PATH 中的系统命令
  "S108",  # 临时目录由构建根托管
  "RUF001",  # 中文文案使用全角标点, 属有意为之
  "RUF002",  # 中文 docstring 同上
  "RUF003",  # 中文注释同上
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S311"]
"scripts/*" = ["S105", "S106", "S107"]
"src/rdc/core/errors.py" = ["S105"]  # 错误码常量名含 TOKEN, 非口令
# 更新源与下载地址来自用户配置的清单, 已做 http/https/file/本地路径白名单校验, 见 manifest.resolve_download_url
"src/rdc/update/service.py" = ["S310"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.mypy]
python_version = "3.12"
files = ["src/rdc"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
