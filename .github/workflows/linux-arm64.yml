name: Linux arm64 构建

# 只为 arm64 出包: x64 走本机/虚机构建, 本工作流仅使用 GitHub 提供的 arm64 runner
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag 或分支, 留空用当前 ref"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Qt 运行依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libfuse2

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pyinstaller==6.10.0

      - name: 构建 deb 与便携 tar.gz
        run: |
          python scripts/build_linux.py --build-root "$GITHUB_WORKSPACE/rdc-build"
          ls -l "$GITHUB_WORKSPACE/rdc-build/artifacts/desktop"

      - name: 校验产物架构
        run: |
          deb=$(ls "$GITHUB_WORKSPACE"/rdc-build/artifacts/desktop/*.deb)
          tar=$(ls "$GITHUB_WORKSPACE"/rdc-build/artifacts/desktop/*.tar.gz)
          dpkg-deb -f "$deb" Architecture
          file "$tar"
          test "$(dpkg-deb -f "$deb" Architecture)" = "arm64"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            rdc-build/artifacts/desktop/*.deb
            rdc-build/artifacts/desktop/*.deb.sha256
            rdc-build/artifacts/desktop/*.tar.gz
            rdc-build/artifacts/desktop/*.tar.gz.sha256
            rdc-build/artifacts/desktop/linux-build-info.json
